[phases.setup]
nixPkgs = ["php", "phpExtensions.gd", "nodejs_20", "composer"]

[phases.install]
cmds = [
  "composer install --optimize-autoloader --no-dev --no-interaction",
  "npm install --omit=dev"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"